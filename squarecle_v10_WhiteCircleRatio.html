<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Squarecle Random</title>

    <style>

        body {
            margin: 0;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        canvas {
            width: 500px;
            height: 500px;

            display: block;
        }

    </style>

</head>


<body>

<canvas id="canvas"></canvas>


<script>


// ================================================
// Canvas
// ================================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


// ================================================
// 웹 표시 크기
// ================================================

const size = 500;


// ================================================
// 고해상도 설정
// ================================================

const resolution = 2;


// ================================================
// 실제 Canvas 해상도
// 500 × 500 → 1000 × 1000
// ================================================

canvas.width = size * resolution;
canvas.height = size * resolution;


// ================================================
// 화면 표시 크기
// ================================================

canvas.style.width = size + "px";
canvas.style.height = size + "px";


// ================================================
// 좌표계 스케일
// ================================================

ctx.scale(resolution, resolution);


// ================================================
// 중심 좌표
// ================================================

const centerX = size / 2;
const centerY = size / 2;


// ================================================
// 원 크기
// ================================================

const radius = 20;


// ================================================
// 원 사이의 간격
// ================================================

const spacing = 40;


// ================================================
// 흰색 캔버스
// ================================================

ctx.fillStyle = "rgb(255, 255, 255)";

ctx.fillRect(
    0,
    0,
    size,
    size
);


// ================================================
// 좌표계 설정
//
// 원점 → Canvas 중앙
// Y축 → 위쪽이 +
// ================================================

ctx.translate(centerX, centerY);

ctx.scale(1, -1);


// ================================================
// 원 그리기 함수
// ================================================

function circle(x, y, radius, color) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = color;

    ctx.fill();
}


// ================================================
// 랜덤 색상 개수 입력
//
// 1~10
// ================================================

function getColorCount() {

    while (true) {

        const input = prompt(
            "사용할 랜덤 색상의 개수를 입력하세요. (1~10)"
        );

        // 취소
        if (input === null) {
            return null;
        }

        // 빈 입력
        if (input.trim() === "") {

            alert(
                "1부터 10 사이의 정수를 입력해주세요."
            );

            continue;
        }

        const count = Number(input);

        // 1~10 사이의 정수
        if (
            Number.isInteger(count) &&
            count >= 1 &&
            count <= 10
        ) {

            return count;
        }

        alert(
            "1부터 10 사이의 정수를 입력해주세요."
        );
    }
}


// ================================================
// 흰색 원 비율 입력
//
// 0~100%
// ================================================

function getWhiteRatio() {

    while (true) {

        const input = prompt(
            "흰색 원의 비율을 입력하세요. (0~100%)"
        );

        // 취소
        if (input === null) {
            return null;
        }

        // 빈 입력
        if (input.trim() === "") {

            alert(
                "0부터 100 사이의 숫자를 입력해주세요."
            );

            continue;
        }

        const ratio = Number(input);

        // 0~100
        if (
            !isNaN(ratio) &&
            ratio >= 0 &&
            ratio <= 100
        ) {

            return ratio;
        }

        alert(
            "0부터 100 사이의 숫자를 입력해주세요."
        );
    }
}


// ================================================
// 랜덤 RGB 색상 생성
// ================================================

function generateRandomColors(count) {

    const colors = [];

    const usedColors = new Set();


    while (colors.length < count) {

        const r = Math.floor(
            Math.random() * 256
        );

        const g = Math.floor(
            Math.random() * 256
        );

        const b = Math.floor(
            Math.random() * 256
        );


        const colorKey =
            `${r},${g},${b}`;


        // 동일 색상 방지
        if (!usedColors.has(colorKey)) {

            usedColors.add(colorKey);

            colors.push([
                r,
                g,
                b
            ]);
        }
    }


    return colors;
}


// ================================================
// 랜덤 색상 배열
// ================================================

let colors = [];


// ================================================
// 흰색 비율
// ================================================

let whiteRatio = 0;


// ================================================
// 랜덤 색상 선택
// ================================================

function randomColor() {

    // ============================================
    // 흰색 원 결정
    // ============================================

    const randomValue =
        Math.random() * 100;


    if (randomValue < whiteRatio) {

        return "rgb(255, 255, 255)";
    }


    // ============================================
    // 랜덤 색상 선택
    // ============================================

    const index = Math.floor(
        Math.random() * colors.length
    );


    const [r, g, b] =
        colors[index];


    return `rgb(${r}, ${g}, ${b})`;
}


// ================================================
// 배열을 랜덤하게 섞는 함수
//
// Fisher-Yates Shuffle
// ================================================

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j = Math.floor(
            Math.random() * (i + 1)
        );


        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }


    return array;
}


// ================================================
// 프로그램 실행
// ================================================


// ================================================
// 1. 랜덤 색상 개수 입력
// ================================================

const colorCount = getColorCount();


// ================================================
// 2. 흰색 원 비율 입력
// ================================================

let whiteInput = null;

if (colorCount !== null) {

    whiteInput = getWhiteRatio();
}


// ================================================
// 취소하지 않은 경우
// ================================================

if (
    colorCount !== null &&
    whiteInput !== null
) {


    // ============================================
    // 흰색 비율 저장
    // ============================================

    whiteRatio = whiteInput;


    // ============================================
    // 랜덤 색상 생성
    // ============================================

    colors =
        generateRandomColors(colorCount);


    // ============================================
    // 모든 원의 좌표
    // ============================================

    const circles = [];


    // ============================================
    // 레이어 생성
    //
    // 1 × 1
    // 2 × 2
    // ...
    // 11 × 11
    // ============================================

    for (
        let layer = 0;
        layer <= 10;
        layer++
    ) {

        const layerSize =
            layer + 1;


        // ========================================
        // 정사각형 시작 좌표
        // ========================================

        const start =
            -(layer * spacing / 2);


        // ========================================
        // 행
        // ========================================

        for (
            let row = 0;
            row < layerSize;
            row++
        ) {


            // ====================================
            // 열
            // ====================================

            for (
                let col = 0;
                col < layerSize;
                col++
            ) {


                // =================================
                // X 좌표
                // =================================

                const x =
                    start + (col * spacing);


                // =================================
                // Y 좌표
                // =================================

                const y =
                    start + (row * spacing);


                // =================================
                // 좌표 저장
                // =================================

                circles.push({

                    x: x,

                    y: y

                });

            }
        }
    }


    // ============================================
    // 중복 좌표 제거
    // ============================================

    const uniqueCircles = [];

    const positionMap = new Map();


    for (
        const circleData of circles
    ) {

        const key =
            `${circleData.x},${circleData.y}`;


        if (!positionMap.has(key)) {

            positionMap.set(key, true);

            uniqueCircles.push(
                circleData
            );
        }
    }


    // ============================================
    // 원 그리기 순서 랜덤화
    // ============================================

    shuffle(uniqueCircles);


    // ============================================
    // 원 그리기
    // ============================================

    for (
        const circleData of uniqueCircles
    ) {

        circle(
            circleData.x,
            circleData.y,
            radius,
            randomColor()
        );
    }

}


</script>

</body>

</html>
